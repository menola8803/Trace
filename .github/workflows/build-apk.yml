name: Bygg APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bygg test-APK
        run: gradle --no-daemon assembleDebug

      - name: Döp om APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Cellkarta-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Cellkarta-test-apk
          path: Cellkarta-test.apk

      - name: Publicera som nedladdning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete senaste --yes --cleanup-tag || true
          gh release create senaste Cellkarta-test.apk \
            --prerelease \
            --title "Cellkarta testversion" \
            --notes "Testversion byggd från ${GITHUB_SHA::7}. Öppna länken på telefonen, ladda ner Cellkarta-test.apk och installera."
